name: One-time Bun lockfile sync for Supabase SDK
on:
  push:
    branches: [feature/horizons-source-import]
    paths:
      - 'apps/web/package.json'
permissions:
  contents: write
jobs:
  regenerate-bun-lock:
    if: github.repository == 'Lorum-Ipsa/Laughing-Ghost-Network'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/horizons-source-import
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Resolve and commit exact lockfile changes
        run: |
          bun install --no-cache
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- bun.lock; then
            git add bun.lock
            git commit -m "chore: lock Supabase JS dependency"
            git push origin HEAD:feature/horizons-source-import
          else
            echo "Bun lockfile already matches package.json."
          fi
