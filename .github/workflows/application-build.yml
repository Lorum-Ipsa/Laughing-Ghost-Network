name: LGN application validation
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'scripts/check-app-source.mjs'
      - '.github/workflows/application-build.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'scripts/check-app-source.mjs'
      - '.github/workflows/application-build.yml'
permissions:
  contents: read
jobs:
  source-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-repository.mjs
      - run: node scripts/check-app-source.mjs
  frontend-build:
    name: Install, build and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install frozen dependency lockfile
        run: bun install --frozen-lockfile
      - name: Build SSR frontend
        run: bun run build
      - name: Typecheck
        run: bun run typecheck

  pocketbase-migrations:
    name: Fresh PocketBase database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/pocketbase
    env:
      PB_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      LGN_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - name: Install export-matched PocketBase 0.40.4
        run: |
          curl --fail --location --show-error --silent --retry 3 \
            https://github.com/pocketbase/pocketbase/releases/download/v0.40.4/pocketbase_0.40.4_linux_amd64.zip \
            --output pocketbase-ci.zip
          unzip -oq pocketbase-ci.zip pocketbase
          chmod +x ./pocketbase
          ./pocketbase --version
      - name: Apply all migrations to a clean, disposable database
        run: |
          ./pocketbase migrate up \
            --dir=./pb_data \
            --migrationsDir=./pb_migrations \
            --hooksDir=./pb_hooks \
            --encryptionEnv=PB_ENCRYPTION_KEY
      - name: Verify no superuser was silently created
        run: |
          python3 - <<'PY'
          import sqlite3
          con = sqlite3.connect('pb_data/data.db')
          count = con.execute('SELECT COUNT(*) FROM "_superusers"').fetchone()[0]
          assert count == 0, f'Unexpected migrated superuser count: {count}'
          print('Zero auto-provisioned superusers.')
          PY
