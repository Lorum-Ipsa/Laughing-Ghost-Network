name: LGN application validation
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'scripts/check-app-source.mjs'
      - '.github/workflows/application-build.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'scripts/check-app-source.mjs'
      - '.github/workflows/application-build.yml'
permissions:
  contents: read
jobs:
  source-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-repository.mjs
      - run: node scripts/check-app-source.mjs
  frontend-build:
    name: Install, build and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install frozen dependency lockfile
        run: bun install --frozen-lockfile
      - name: Validate Ghost handle syntax and slash-safe routing
        run: bun test apps/web/tests/ghost-handle.test.ts
      - name: Build SSR frontend
        run: bun run build
      - name: Typecheck
        run: bun run typecheck

  pocketbase-migrations:
    name: Fresh PocketBase database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/pocketbase
    env:
      PB_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      LGN_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - name: Install export-matched PocketBase 0.40.4
        run: |
          curl --fail --location --show-error --silent --retry 3 \
            https://github.com/pocketbase/pocketbase/releases/download/v0.40.4/pocketbase_0.40.4_linux_amd64.zip \
            --output pocketbase-ci.zip
          unzip -oq pocketbase-ci.zip pocketbase
          chmod +x ./pocketbase
          ./pocketbase --version
      - name: Apply all migrations to a clean, disposable database
        run: |
          ./pocketbase migrate up \
            --dir=./pb_data \
            --migrationsDir=./pb_migrations \
            --hooksDir=./pb_hooks \
            --encryptionEnv=PB_ENCRYPTION_KEY
      - name: Verify no superuser was silently created
        run: |
          python3 - <<'PY'
          import sqlite3
          con = sqlite3.connect('pb_data/data.db')
          count = con.execute('SELECT COUNT(*) FROM "_superusers"').fetchone()[0]
          assert count == 0, f'Unexpected migrated superuser count: {count}'
          print('Zero auto-provisioned superusers.')
          PY

  codespaces-preview-smoke:
    name: Public-page preview smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare independent development stack
        run: bash .devcontainer/setup.sh
      - name: Start app and check browser-facing endpoints
        run: |
          # Reproduce the GitHub Codespaces host/port-forwarding environment.
          export CODESPACES=true
          export CODESPACE_NAME=lgn-ci-preview
          bash .devcontainer/start.sh > "$RUNNER_TEMP/lgn-preview.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > "$RUNNER_TEMP/health.json"; then
              ready=true
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "LGN preview process stopped."
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "LGN preview did not become healthy."
            exit 1
          fi
          cat "$RUNNER_TEMP/health.json"
          curl --fail --silent http://127.0.0.1:3000/ --output "$RUNNER_TEMP/home.html"
          grep -qi 'Laughing Ghost' "$RUNNER_TEMP/home.html"
          # Codespaces proxy forwards with an app.github.dev Host header.
          curl --fail --silent --show-error \
            -H 'Host: lgn-ci-preview-3000.app.github.dev' \
            http://127.0.0.1:3000/ --output "$RUNNER_TEMP/codespaces-home.html"
          grep -qi 'Laughing Ghost' "$RUNNER_TEMP/codespaces-home.html"
          # The actual searchable directory must render both legacy and new
          # public Ghost profiles through their respective safe read paths.
          curl --fail --silent --show-error http://127.0.0.1:3000/ghosts \
            --output "$RUNNER_TEMP/ghost-directory.html"
          grep -qi 'Search the Network' "$RUNNER_TEMP/ghost-directory.html"
          # The real visitor auth pages must all respond successfully without
          # using the optional /supabase-lab experiment.
          for page in join login verify-email reset-password ghost-space; do
            echo "Checking /$page"
            curl --fail --silent --show-error "http://127.0.0.1:3000/$page" \
              --output "$RUNNER_TEMP/auth-$page.html"
            test -s "$RUNNER_TEMP/auth-$page.html"
          done
          # Client-only auth must never ship an account secret in server HTML.
          if grep -Eqi 'sb_secret_|service_role|PB_SUPERUSER_PASSWORD=' "$RUNNER_TEMP"/auth-*.html; then
            echo "Unexpected secret marker in auth page HTML"
            exit 1
          fi
          # The experimental Supabase identity page must be unavailable unless
          # explicitly enabled by an individual developer.
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/supabase-lab)
          test "$status" = '404'

