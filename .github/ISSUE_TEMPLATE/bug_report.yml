name: Bug report
description: Report a reproducible non-sensitive LGN defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not disclose vulnerabilities, credentials, member data, or sensitive personal information here. Follow SECURITY.md for private reporting."
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use test data only.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment or branch
      placeholder: e.g., local development / branch name
